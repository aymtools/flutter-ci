# 路径：.github/workflows/dart-publish.yml
# 功能：统一的 Dart 发布工作流。由 Tag 驱动判断正式/预发布，并强制校验 Tag 与 YAML 版本一致性。

name: Reusable Dart Publish

on:
  workflow_call:
    inputs:
      main_branch_name:
        description: '正式分支名称'
        default: 'main'
        required: false
        type: string
      working_directory:
        description: '项目所在目录'
        default: '.'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: 🚀 Publish to Pub.dev
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: sudo snap install yq

      - name: Parse & Validate Version
        id: info
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION=$(echo "$TAG" | sed 's/^v//')
          YAML_VERSION=$(yq eval '.version' pubspec.yaml)
          
          echo "🏷 Tag Version: $TAG_VERSION"
          echo "📦 YAML Version: $YAML_VERSION"
          
          # 1. 强制一致性校验
          if [ "$TAG_VERSION" != "$YAML_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pubspec.yaml version ($YAML_VERSION)"
            exit 1
          fi
          
          # 2. 性质判断：正式版不能包含短横线（SemVer 预发布标识）
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "🎯 识别为正式版本 (Formal Release)"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "🚀 识别为预发布版本 (Pre-release)"
          fi

      # ==========================================================
      # 正式版专项校验 (仅当 is_release 为 true 时运行)
      # ==========================================================
      
      - name: [Release Only] Verify Main Branch
        if: steps.info.outputs.is_release == 'true'
        run: |
          if ! git branch -r --contains ${{ github.sha }} | grep -E "(^|\/)${{ inputs.main_branch_name }}$"; then
            echo "::error::正式版标签 [$TAG] 必须在 ${{ inputs.main_branch_name }} 分支上触发！"
            exit 1
          fi

      - name: [Release Only] Verify Changelog
        if: steps.info.outputs.is_release == 'true'
        run: |
          VERSION=$(yq eval '.version' pubspec.yaml)
          if [ ! -f "CHANGELOG.md" ]; then
            echo "::error::未找到 CHANGELOG.md"
            exit 1
          fi
          if ! grep -qE "^## +\[?$VERSION\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 中缺失版本 [$VERSION] 的二级标题说明！"
            exit 1
          fi

      # ==========================================================
      # 公共发布流程
      # ==========================================================

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Install dependencies
        run: dart pub get

      - name: Publish Dry-run
        run: dart pub publish --dry-run

      - name: Publish to Pub.dev
        run: dart pub publish --force
